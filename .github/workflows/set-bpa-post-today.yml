name: Set BPA Post Date To Today

on:
  push:
    paths:
      - '.github/workflows/set-bpa-post-today.yml'

permissions:
  contents: write

jobs:
  update-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set BPA post to September 11 2026
        shell: bash
        run: |
          set -euo pipefail
          OLD='_posts/2026-02-28-what-is-business-process-automation-and-do-you-need-it.md'
          NEW='_posts/2026-09-11-what-is-business-process-automation-and-do-you-need-it.md'
          sed -i '0,/date: 2026-02-28T08:00:00/s//date: 2026-09-11T08:00:00/' "$OLD"
          git mv "$OLD" "$NEW"
          git rm '.github/workflows/set-bpa-post-today.yml'

      - name: Commit correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Business Process Automation Field Note September 11 2026'
          git push
