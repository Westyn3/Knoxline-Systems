name: Scheduled Pages Rebuild

on:
  schedule:
    # GitHub Actions cron uses UTC.
    # Run at both possible 8:05 AM Eastern UTC equivalents so DST is covered.
    # The timezone check below ensures only the real 8:05 AM America/New_York run deploys.
    - cron: '5 12 * * *'
    - cron: '5 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether it is 8:05 AM Eastern
        id: eastern_time
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          HOUR=$(TZ=America/New_York date +'%H')
          MINUTE=$(TZ=America/New_York date +'%M')

          if [ "$EVENT_NAME" = "workflow_dispatch" ] || { [ "$HOUR" = "08" ] && [ "$MINUTE" = "05" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.eastern_time.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Trigger GitHub Pages rebuild
        if: steps.eastern_time.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Scheduled Pages rebuild"
          git push
