name: Scheduled Pages Rebuild

on:
  schedule:
    # GitHub Actions cron uses UTC.
    # Run Fridays at both possible 8:05 AM Eastern UTC equivalents so DST is covered.
    # Only the run during the 8 AM America/New_York hour deploys.
    - cron: '5 12 * * 5'
    - cron: '5 13 * * 5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check whether it is the 8 AM Eastern hour
        id: eastern_time
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          HOUR=$(TZ=America/New_York date +'%H')

          # Manual runs always proceed. Scheduled runs proceed during the 8 AM
          # Eastern hour so a small GitHub Actions scheduling delay won't skip publishing.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$HOUR" = "08" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.eastern_time.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        if: steps.eastern_time.outputs.run == 'true'
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        if: steps.eastern_time.outputs.run == 'true'
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        if: steps.eastern_time.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        if: steps.eastern_time.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
