name: Scheduled Pages Rebuild

on:
  # Deploy whenever main changes (merges and direct pushes).
  push:
    branches: [main]
  schedule:
    # GitHub Actions cron uses UTC, and GitHub often starts scheduled runs hours late.
    # Build every day with no time-of-day gate: future-dated posts stay hidden
    # (future: false) until a build runs after their date, then publish automatically.
    - cron: '5 12 * * *'
    - cron: '5 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
