name: Fix Jekyll Post Filenames

on:
  push:
    paths:
      - '.github/workflows/fix-jekyll-post-filenames.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rename posts from front matter dates
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          for file in _posts/*.md; do
            base="$(basename "$file")"

            # Already a valid Jekyll post filename.
            if [[ "$base" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}- ]]; then
              continue
            fi

            date_value="$(sed -n 's/^date:[[:space:]]*//p' "$file" | head -n 1)"
            post_date="${date_value:0:10}"

            if [[ ! "$post_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "Could not determine Jekyll date for $file" >&2
              exit 1
            fi

            target="_posts/${post_date}-${base}"
            if [[ -e "$target" ]]; then
              echo "Target already exists: $target" >&2
              exit 1
            fi

            echo "Renaming $file -> $target"
            git mv "$file" "$target"
          done

          # This migration should only run once.
          git rm .github/workflows/fix-jekyll-post-filenames.yml

          if git diff --cached --quiet; then
            echo "No filename changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix Jekyll post filenames"
          git push
